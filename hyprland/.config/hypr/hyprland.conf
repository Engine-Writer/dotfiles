env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP

exec-once = systemctl --user start hyprpolkitagent

# Waybar liquid glass blur (added by update-waybar-glass.sh)
layerrule = blur, waybar
layerrule = ignorealpha 0.2, waybar

# Waybar liquid glass (added by update-waybar-glass.sh)
layerrule = blur, waybar
layerrule = ignorealpha 0.15, waybar
layerrule = noise 0.03, waybar

# stronger blur for glass effect
decoration {
    blur {
        enabled = true
        size = 8
        passes = 4
        noise = 0.02
        contrast = 1.1
        brightness = 0.9
        vibrancy = 0.3
    }
}
